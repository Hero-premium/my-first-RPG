# حارس البوابة
gatekeeper.welcome=حارس البوابة: مرحبًا بك في هذا الزنزانة، لكن مجيئك إلى هنا كان خطأً كبيرًا! فهناك تنين غاضب مستعد لمطاردة كل من يدخل.
gatekeeper.ask_name=حارس البوابة: ماذا أناديك أيها الصياد؟
gatekeeper.warn_mission=حارس البوابة: لكن {playerName}، هذه مهمة خطيرة جدًا، كيف تخطط للقيام بها؟
gatekeeper.askAbilities=حارس البوابة: وما هي...؟
gatekeeper.challenge=حارس البوابة: أوه، ما كان ينبغي أن تخبرني بذلك، لأنني سأكون خصمك الأول. سأدافع عن سيدي بحياتي!


# اللاعب
player.motivation=اللاعب: نعم! أعلم ذلك، لكنني أريد الذهب الذي يخفيه التنين تحت عرشه.
player.explain_moves={playerName}: بالطبع لم آتِ دون استعداد، لدي بعض الحركات التي ستساعدني على هزيمة هذا الوحش الشرير.
player.dash={playerName}: الاندفاع! قدرة رائعة ستساعدني على تفادي هجمات التنين، لكنني أحيانًا لا أتحرك بالسرعة الكافية.
player.swordSlash=ضربة بالسيف: لست جيدًا جدًا في استخدام سيفي، لكنه يساعدني على مهاجمة الأعضاء الحيوية، لكنني غالبًا لا أستطيع فعل ذلك.
player.kick=ركلة: إحدى أفضل حركاتي التي أتقنتها، وهي لا تزال تعتمد على قدراتي البشرية، لكنها موثوقة جدًا.


